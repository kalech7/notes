    <text x="355" y="427">25 %</text>
    <text x="485" y="427">50 %</text>
    <text x="615" y="427">75 %</text>
    <text x="745" y="427">100 %</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#344054" text-anchor="end">
    <text x="210" y="119">WALKING</text>
    <text x="210" y="170">WALKING_UPSTAIRS</text>
    <text x="210" y="221">WALKING_DOWNSTAIRS</text>
    <text x="210" y="272">SITTING</text>
    <text x="210" y="323">STANDING</text>
    <text x="210" y="374">LAYING</text>
  </g>

  <g>
    <rect x="225" y="96" width="355.3" height="30" rx="7" fill="#6d5dfc"/>
    <rect x="225" y="147" width="416" height="30" rx="7" fill="#6d5dfc"/>
    <rect x="225" y="198" width="294.7" height="30" rx="7" fill="#ed7125"/>
    <rect x="225" y="249" width="381.3" height="30" rx="7" fill="#078b75"/>
    <rect x="225" y="300" width="442" height="30" rx="7" fill="#078b75"/>
    <rect x="225" y="351" width="502.7" height="30" rx="7" fill="#078b75"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#101828">
    <text x="590" y="116">68,33 %</text>
    <text x="651" y="167">80,00 %</text>
    <text x="530" y="218">56,67 %</text>
    <text x="617" y="269">73,33 %</text>
    <text x="678" y="320">85,00 %</text>
