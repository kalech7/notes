<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" role="img" aria-labelledby="title desc">
  <title id="title">Exactitud por actividad</title>
  <desc id="desc">Gráfico de barras horizontales. Laying alcanza 96,67 por ciento y Walking Downstairs 56,67 por ciento.</desc>
  <rect width="900" height="455" rx="16" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="28" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101828">Exactitud por actividad</text>
  <text x="28" y="62" font-family="Arial, sans-serif" font-size="13" fill="#667085">60 ventanas de prueba por clase · exactitud global: 76,67 %</text>

  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="225" y1="82" x2="225" y2="405"/>
    <line x1="355" y1="82" x2="355" y2="405"/>
    <line x1="485" y1="82" x2="485" y2="405"/>
    <line x1="615" y1="82" x2="615" y2="405"/>
    <line x1="745" y1="82" x2="745" y2="405"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="middle">
