<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56627A"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="#F7F9FC"/>
  <text x="60" y="68" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Condicionamiento: cuánto amplifica un problema el ruido</text>
  <text x="60" y="100" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">Estabilidad habla del algoritmo; condicionamiento habla del problema</text>
  
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="300" height="160" rx="18" fill="#FFFFFF" stroke="#2AA876" stroke-width="2"/>
    <text x="90" y="209" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Bien condicionado</text>
    <text x="90" y="239" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">entrada cambia 0,1 %</text><text x="90" y="263" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">salida cambia ≈0,1 %</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="175" width="300" height="160" rx="18" fill="#FFFFFF" stroke="#E25555" stroke-width="2"/>
    <text x="470" y="209" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Mal condicionado</text>
    <text x="470" y="239" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">entrada cambia 0,1 %</text><text x="470" y="263" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">salida cambia 100× o más</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="830" y="175" width="300" height="160" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
    <text x="850" y="209" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Qué hacer</text>
    <text x="850" y="239" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">QR/SVD, regularizar</text><text x="850" y="263" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">escalar y medir κ(A)</text>
  </g>
  <g><line x1="370" y1="255" x2="450" y2="255" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g><g><line x1="750" y1="255" x2="830" y2="255" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g>
  <text x="600" y="455" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">error relativo de salida ≤ κ(A) × error relativo de entrada</text>
  <rect x="60" y="625" width="1080" height="42" rx="14" fill="#172033"/><text x="600" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Evita formar A⁻¹ y AᵀA sin necesidad: pueden amplificar redondeo y condición</text>

</svg>