<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56627A"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="#F7F9FC"/>
  <text x="60" y="68" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Anatomía de un experimento reproducible</text>
  <text x="60" y="100" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">Un número sin contexto no es un resultado científico</text>
  
  <g filter="url(#shadow)">
    <rect x="70" y="160" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
    <text x="90" y="194" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Entradas</text>
    <text x="90" y="224" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">datos + versión</text><text x="90" y="248" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">código + entorno</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="160" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#815AC0" stroke-width="2"/>
    <text x="470" y="194" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Configuración</text>
    <text x="470" y="224" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">seed, split, features</text><text x="470" y="248" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">modelo, hiperparámetros</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="830" y="160" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#F59E42" stroke-width="2"/>
    <text x="850" y="194" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Ejecución</text>
    <text x="850" y="224" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">logs y validaciones</text><text x="850" y="248" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">errores visibles</text>
  </g>
  <g><line x1="370" y1="232" x2="450" y2="232" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g><g><line x1="750" y1="232" x2="830" y2="232" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g>
  <g filter="url(#shadow)">
    <rect x="210" y="415" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#19A7AE" stroke-width="2"/>
    <text x="230" y="449" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Artefactos</text>
    <text x="230" y="479" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">modelo, predicciones</text><text x="230" y="503" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">hashes y métricas</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="415" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#2AA876" stroke-width="2"/>
    <text x="680" y="449" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Explicación</text>
    <text x="680" y="479" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">supuestos, límites</text><text x="680" y="503" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">y decisión resultante</text>
  </g>
  <g><line x1="540" y1="480" x2="660" y2="480" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g>
  <rect x="60" y="625" width="1080" height="42" rx="14" fill="#172033"/><text x="600" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Reproducible = otra persona puede reconstruir qué ocurrió y por qué</text>

</svg>