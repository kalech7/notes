<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56627A"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="#F7F9FC"/>
  <text x="60" y="68" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Sesgo, varianza y generalización</text>
  <text x="60" y="100" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">La menor pérdida de training no garantiza el menor error futuro</text>
  
  <line x1="130" y1="540" x2="1080" y2="540" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="130" y1="540" x2="130" y2="155" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M160 205 C420 300, 720 450, 1050 510" fill="none" stroke="#2F6BFF" stroke-width="7"/>
  <path d="M160 205 C370 500, 680 520, 1050 240" fill="none" stroke="#E25555" stroke-width="7"/>
  <line x1="610" y1="190" x2="610" y2="545" stroke="#2AA876" stroke-width="4" stroke-dasharray="10 9"/>
  <text x="910" y="500" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#2F6BFF">training</text>
  <text x="900" y="305" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#E25555">validation</text>
  <text x="610" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2AA876">complejidad útil</text>
  <text x="600" y="590" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">complejidad del modelo →</text>
  <text x="45" y="350" transform="rotate(-90 45 350)" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">error esperado</text>
  <rect x="60" y="625" width="1080" height="42" rx="14" fill="#172033"/><text x="600" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Subajuste ← sesgo alto · punto útil · varianza alta → sobreajuste</text>

</svg>