<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56627A"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="#F7F9FC"/>
  <text x="60" y="68" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Proyecto: autenticación continua por dinámica de mouse</text>
  <text x="60" y="100" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#56627A">Del evento crudo a una decisión auditable, sin usar el test para calibrar</text>
  
  <g filter="url(#shadow)">
    <rect x="45" y="170" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#815AC0" stroke-width="2"/>
    <text x="65" y="204" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Eventos</text>
    <text x="65" y="234" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">t, x, y</text><text x="65" y="258" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">botón, estado</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="275" y="170" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
    <text x="295" y="204" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Sesión</text>
    <text x="295" y="234" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">trayectoria</text><text x="295" y="258" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">unidad indivisible</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="505" y="170" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#19A7AE" stroke-width="2"/>
    <text x="525" y="204" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">17 features</text>
    <text x="525" y="234" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">velocidad, pausas</text><text x="525" y="258" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">ángulos, distancia</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="735" y="170" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#F59E42" stroke-width="2"/>
    <text x="755" y="204" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Perfil</text>
    <text x="755" y="234" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">RMS-z</text><text x="755" y="258" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">Isolation Forest</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="965" y="170" width="190" height="160" rx="18" fill="#FFFFFF" stroke="#E25555" stroke-width="2"/>
    <text x="985" y="204" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Decisión</text>
    <text x="985" y="234" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">score ≥ τ</text><text x="985" y="258" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">alarma</text>
  </g>
  <g><line x1="235" y1="250" x2="275" y2="250" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g><g><line x1="465" y1="250" x2="505" y2="250" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g><g><line x1="695" y1="250" x2="735" y2="250" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g><g><line x1="925" y1="250" x2="965" y2="250" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/></g>
  <g filter="url(#shadow)">
    <rect x="235" y="425" width="300" height="120" rx="18" fill="#FFFFFF" stroke="#2AA876" stroke-width="2"/>
    <text x="255" y="459" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Validation legítimo</text>
    <text x="255" y="489" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">elige τ sin mirar test</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="665" y="425" width="300" height="120" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
    <text x="685" y="459" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Test público</text>
    <text x="685" y="489" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#56627A">mide FAR, FRR, F1</text>
  </g>
  <g><line x1="535" y1="485" x2="665" y2="485" stroke="#56627A" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#56627A">umbral fijo</text></g>
  <rect x="60" y="625" width="1080" height="42" rx="14" fill="#172033"/><text x="600" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Score alto significa anomalía; anomalía no prueba intención maliciosa</text>

</svg>