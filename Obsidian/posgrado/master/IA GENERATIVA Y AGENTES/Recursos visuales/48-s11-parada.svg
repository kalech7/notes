<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183247">48 · Parar también forma parte del diseño</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#526777">Definición del ejemplo: un paso es una decisión del modelo, incluso si finaliza.</text><rect x="55" y="160" width="350" height="100" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="73" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">¿Quedan pasos?</text><rect x="520" y="160" width="350" height="100" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="538" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Decisión del modelo</text><rect x="990" y="160" width="350" height="100" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="1008" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">¿Es respuesta final?</text><polyline points="405,210 520,210" fill="none" stroke="#183247" stroke-width="3"/><polygon points="520,210 506.49329346470984,216.52448301166845 506.49329346470984,203.47551698833155" fill="#183247"/><text x="440" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">Sí</text><polyline points="870,210 990,210" fill="none" stroke="#183247" stroke-width="3"/><polygon points="990,210 976.4932934647098,216.52448301166845 976.4932934647098,203.47551698833155" fill="#183247"/><rect x="990" y="360" width="350" height="110" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="1008" y="402" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Sí: terminar</text><text x="1008" y="435" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Guardar respuesta</text><polyline points="1165,260 1165,360" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1165,360 1158.4755169883315,346.49329346470984 1171.5244830116685,346.49329346470984" fill="#183247"/><rect x="520" y="520" width="350" height="115" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="538" y="562" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">No: validar, ejecutar</text><text x="538" y="595" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">y añadir resultado</text><polyline points="990,240 930,240 930,575 870,575" fill="none" stroke="#183247" stroke-width="3"/><polygon points="870,575 883.5067065352902,568.4755169883315 883.5067065352902,581.5244830116685" fill="#183247"/><polyline points="520,575 455,575 455,290 230,290 230,260" fill="none" stroke="#183247" stroke-width="3"/><polygon points="230,260 236.52448301166845,273.50670653529016 223.47551698833155,273.50670653529016" fill="#183247"/><text x="260" y="632" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Siguiente decisión</text><rect x="55" y="335" width="350" height="115" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="73" y="377" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">No: cierre incompleto</text><text x="73" y="410" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Explicar qué falta</text><polyline points="100,260 100,335" fill="none" stroke="#183247" stroke-width="3"/><polygon points="100,335 93.47551698833155,321.49329346470984 106.52448301166845,321.49329346470984" fill="#183247"/><text x="65" y="740" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">El límite de pasos no reemplaza el timeout de cada operación.</text><text x="55" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526777">Esquema del simulador incluido. Otros programas pueden contar pasos de forma diferente.</text></svg>