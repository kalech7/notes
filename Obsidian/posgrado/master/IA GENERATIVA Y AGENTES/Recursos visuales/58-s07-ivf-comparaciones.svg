<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">58 · Abrir más celdas aumenta el trabajo</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">N = 100000; nlist = 64; celdas equilibradas; comparaciones, no milisegundos.</text><text x="55" y="188" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">nprobe 1</text><rect x="290" y="165" width="13.3373" height="36" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="333.3373" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">1 626,5</text><text x="55" y="273" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">nprobe 2</text><rect x="290" y="250" width="26.149800000000003" height="36" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="346.1498" y="275" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">3 189</text><text x="55" y="358" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">nprobe 4</text><rect x="290" y="335" width="51.7748" height="36" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="371.7748" y="360" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">6 314</text><text x="55" y="443" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">nprobe 8</text><rect x="290" y="420" width="103.0248" height="36" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="423.0248" y="445" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">12 564</text><text x="55" y="528" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">nprobe 16</text><rect x="290" y="505" width="205.52479999999997" height="36" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="525.5247999999999" y="530" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">25 064</text><text x="55" y="613" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">Exacto</text><rect x="290" y="590" width="820.0" height="36" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="1140.0" y="615" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">100 000</text><text x="285.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">0</text><text x="490.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">25000</text><text x="695.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">50000</text><text x="900.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">75000</text><text x="1105.0" y="723" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">100000</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Cálculo: nlist + (N/nlist) × nprobe. El tiempo también depende de memoria, paralelismo y acceso.</text></svg>