<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183247">46 · Toolformer: construir datos y ajustar pesos</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#526777">La pérdida de predicción sirve para filtrar llamadas candidatas útiles.</text><rect x="55" y="180" width="395" height="125" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="73" y="222" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">1. Texto original</text><text x="73" y="255" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">+ demostraciones</text><rect x="500" y="180" width="395" height="125" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="518" y="222" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">2. Muestrear</text><text x="518" y="255" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">llamadas candidatas</text><rect x="945" y="180" width="395" height="125" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="963" y="222" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">3. Ejecutar APIs</text><text x="963" y="255" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">y obtener resultados</text><polyline points="450,245 500,245" fill="none" stroke="#183247" stroke-width="3"/><polygon points="500,245 486.49329346470984,251.52448301166845 486.49329346470984,238.47551698833155" fill="#183247"/><polyline points="895,245 945,245" fill="none" stroke="#183247" stroke-width="3"/><polygon points="945,245 931.4932934647098,251.52448301166845 931.4932934647098,238.47551698833155" fill="#183247"/><rect x="945" y="460" width="395" height="145" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="963" y="502" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">4. Filtrar</text><text x="963" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Conservar si la reducción</text><text x="963" y="568" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">de pérdida alcanza el umbral</text><rect x="500" y="460" width="395" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="518" y="502" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">5. Corpus aumentado</text><text x="518" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Texto con llamadas</text><text x="518" y="568" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">y resultados</text><rect x="55" y="460" width="395" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="73" y="502" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">6. Ajuste fino</text><text x="73" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Los parámetros cambian</text><text x="73" y="568" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">θ → θ nuevo</text><polyline points="1140,305 1140,460" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1140,460 1133.4755169883315,446.49329346470984 1146.5244830116685,446.49329346470984" fill="#183247"/><polyline points="945,530 895,530" fill="none" stroke="#183247" stroke-width="3"/><polygon points="895,530 908.5067065352902,523.4755169883315 908.5067065352902,536.5244830116685" fill="#183247"/><polyline points="500,530 450,530" fill="none" stroke="#183247" stroke-width="3"/><polygon points="450,530 463.50670653529016,523.4755169883315 463.50670653529016,536.5244830116685" fill="#183247"/><text x="65" y="702" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">En la inferencia posterior: emitir llamada → ejecutar fuera del modelo → continuar texto.</text><text x="55" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526777">Redibujo conceptual propio basado en Schick et al. (2023), sección 2. No es un entrenamiento ejecutado aquí.</text></svg>