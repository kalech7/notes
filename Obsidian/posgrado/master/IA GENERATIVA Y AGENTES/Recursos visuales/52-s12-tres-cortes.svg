<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">52 · Tres cortes complementarios</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">El control vive en el programa y se aplica antes de repetir la operación.</text><text x="55" y="195" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">TOPE DE PASOS</text><rect x="55" y="235" width="395" height="230" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="274" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Como máximo 5</text><text x="71" y="306" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">decisiones del modelo.</text><text x="71" y="338" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Acota las vueltas.</text><text x="500" y="195" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">REPETICIÓN</text><rect x="500" y="235" width="395" height="230" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="516" y="274" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Misma tool + entrada,</text><text x="516" y="306" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">sin progreso relevante.</text><text x="516" y="338" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Identifica estancamiento.</text><text x="945" y="195" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">PRESUPUESTO</text><rect x="945" y="235" width="395" height="230" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="961" y="274" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Tokens, llamadas,</text><text x="961" y="306" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">tiempo y dinero.</text><text x="961" y="338" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Acota los recursos.</text><rect x="120" y="580" width="1160" height="120" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="136" y="619" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Se detiene con una razón explícita y se conserva lo ocurrido.</text><text x="136" y="651" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Una respuesta final aún necesita verificación.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Un tope de iteraciones no evita que una operación se bloquee: también hacen falta timeouts.</text></svg>