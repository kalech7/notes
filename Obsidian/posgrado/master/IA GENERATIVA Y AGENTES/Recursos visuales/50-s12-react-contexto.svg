<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">50 · Pensar cambia contexto; actuar trae evidencia</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">ReAct intercalado: una propuesta del modelo tiene que contrastarse con el entorno.</text><rect x="55" y="170" width="520" height="150" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="71" y="209" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">THOUGHT</text><text x="71" y="241" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Organizar lo que se sabe.</text><text x="71" y="273" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Identificar el dato que falta.</text><rect x="795" y="170" width="550" height="150" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="811" y="209" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">ACTION</text><text x="811" y="241" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">estadisticas_ventas(&quot;2026-04&quot;)</text><text x="811" y="273" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">El programa ejecuta la consulta.</text><polyline points="575,245 795,245" fill="none" stroke="#183247" stroke-width="3"/><polygon points="795,245 782.3937405670625,251.08951747755722 782.3937405670625,238.91048252244278" fill="#183247"/><rect x="795" y="470" width="550" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="811" y="509" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">OBSERVATION</text><text x="811" y="541" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Total: 1670; 3 ventas.</text><text x="811" y="573" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Dato devuelto por la herramienta.</text><polyline points="1070,320 1070,470" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1070,470 1063.9104825224429,457.39374056706254 1076.0895174775571,457.39374056706254" fill="#183247"/><rect x="55" y="470" width="520" height="145" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="71" y="509" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">SIGUIENTE DECISIÓN</text><text x="71" y="541" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Comparar 1670 con 2695.</text><text x="71" y="573" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Responder o pedir otro dato.</text><polyline points="795,540 575,540" fill="none" stroke="#183247" stroke-width="3"/><polygon points="575,540 587.6062594329375,533.9104825224427 587.6062594329375,546.0895174775573" fill="#183247"/><polyline points="310,470 310,320" fill="none" stroke="#183247" stroke-width="3"/><polygon points="310,320 316.08951747755725,332.60625943293746 303.91048252244275,332.60625943293746" fill="#183247"/><text x="65" y="723" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">Un Thought no comprueba su propia afirmación. Una Observation tampoco es infalible.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Ejemplo propio con datos del notebook. No representa razonamiento privado ni una corrida de LLM.</text></svg>