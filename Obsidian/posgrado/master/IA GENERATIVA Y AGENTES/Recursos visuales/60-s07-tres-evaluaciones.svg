<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">60 · Tres evaluaciones, tres preguntas</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Buscar casi como el exacto no demuestra recuperar evidencia útil ni responder fielmente.</text><rect x="55" y="210" width="395" height="270" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="247" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">ÍNDICE ANN</text><text x="71" y="277" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Referencia: kNN exacto</text><text x="71" y="307" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">¿Coinciden los vecinos?</text><text x="71" y="337" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Ejemplo: recall = 0,98</text><rect x="500" y="210" width="395" height="270" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="516" y="247" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">RECUPERACIÓN</text><text x="516" y="277" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Referencia: evidencia</text><text x="516" y="307" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">¿Llegó el dato necesario?</text><text x="516" y="337" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Ejemplo: Hit Rate = 0,55</text><rect x="945" y="210" width="395" height="270" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="961" y="247" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">RESPUESTA</text><text x="961" y="277" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Referencia: contexto</text><text x="961" y="307" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">¿Está respaldada?</text><text x="961" y="337" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">No se deduce de 0,98.</text><polyline points="450,340 500,340" fill="none" stroke="#183247" stroke-width="3"/><polygon points="500,340 487.39374056706254,346.08951747755725 487.39374056706254,333.91048252244275" fill="#183247"/><polyline points="895,340 945,340" fill="none" stroke="#183247" stroke-width="3"/><polygon points="945,340 932.3937405670625,346.08951747755725 932.3937405670625,333.91048252244275" fill="#183247"/><rect x="115" y="595" width="1170" height="115" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="131" y="633" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Un índice puede reproducir perfectamente un ranking que no sirve para la pregunta.</text><text x="131" y="664" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">La causa puede estar en texto, embeddings, filtros, contexto o generación.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Números del escenario didáctico del PDF; no son mediciones propias del laboratorio.</text></svg>