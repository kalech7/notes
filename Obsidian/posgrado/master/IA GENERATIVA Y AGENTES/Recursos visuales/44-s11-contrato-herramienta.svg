<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183247">44 · La descripción orienta; el código controla</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#526777">Son dos responsabilidades diferentes y ambas deben estar presentes.</text><rect x="55" y="160" width="580" height="250" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="73" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">LO QUE RECIBE EL MODELO</text><text x="73" y="235" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Nombre de la herramienta</text><text x="73" y="268" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Cuándo usarla y cuándo no</text><text x="73" y="301" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Parámetros y restricciones</text><text x="73" y="334" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Formato del resultado</text><rect x="765" y="160" width="580" height="250" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="783" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">LO QUE HACE EL HARNESS</text><text x="783" y="235" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Comprueba nombre permitido</text><text x="783" y="268" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Valida estructura y dominio</text><text x="783" y="301" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Aplica permisos y límites</text><text x="783" y="334" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Ejecuta y registra el resultado</text><polyline points="635,285 765,285" fill="none" stroke="#183247" stroke-width="3"/><polygon points="765,285 751.4932934647098,291.52448301166845 751.4932934647098,278.47551698833155" fill="#183247"/><rect x="55" y="490" width="580" height="180" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="73" y="532" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Ejemplo de selección</text><text x="73" y="565" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">&quot;Dame el total de marzo&quot;</text><text x="73" y="598" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">total_ventas(mes=&quot;2026-03&quot;)</text><rect x="765" y="490" width="580" height="180" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="783" y="532" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Ejemplo de rechazo</text><text x="783" y="565" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">mes=&quot;2026-99&quot;</text><text x="783" y="598" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Error: mes fuera del dominio</text><text x="65" y="741" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">Escribir &quot;solo lectura&quot; en un prompt no cambia los permisos de la base.</text><text x="55" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526777">Esquema conceptual de diseño, independiente de la API de un proveedor.</text></svg>