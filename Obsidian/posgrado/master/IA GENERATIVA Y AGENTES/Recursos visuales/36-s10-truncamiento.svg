<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#F4F7FB"/>
<text x="65" y="45" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">Truncamiento: guardar no equivale a representar</text>
<text x="65" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">Ejemplo didáctico: 900 tokens de contenido; límite total de 128; 2 tokens especiales.</text>
<text x="65" y="185" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">FRAGMENTO GUARDADO: 900 TOKENS</text>
<rect x="65" y="240" width="1470" height="115" rx="18" fill="#FBECEE" stroke="#A63E45" stroke-width="2"/>
<rect x="65" y="240" width="206" height="115" rx="18" fill="#CDEEE6" stroke="#147D73" stroke-width="2"/>
<text x="85" y="278" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#147D73" dominant-baseline="text-before-edge">126 tokens</text>
<text x="585" y="278" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">774 tokens fuera de la entrada del encoder</text>
<text x="65" y="381" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#147D73" dominant-baseline="text-before-edge">14 % del contenido entra</text>
<text x="640" y="381" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">86 % no contribuye directamente a este embedding</text>
<path d="M168,430 L168,525" stroke="#147D73" stroke-width="4" fill="none"/>
<path d="M168,525 L160.80861692093694,511.8362615716444" stroke="#147D73" stroke-width="4" fill="none"/>
<path d="M168,525 L175.19138307906303,511.8362615716444" stroke="#147D73" stroke-width="4" fill="none"/>
<rect x="65" y="545" width="470" height="160" rx="18" fill="#E2F3EE" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#147D73" dominant-baseline="text-before-edge">Embedding</text>
<text x="87" y="612" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">El vector se calcula a partir</text>
<text x="87" y="647" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">del prefijo efectivo.</text>
<path d="M1100,430 L1100,525" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M1100,525 L1092.8086169209369,511.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M1100,525 L1107.1913830790631,511.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<rect x="670" y="545" width="865" height="160" rx="18" fill="#EAF2FC" stroke="#CBD6E2" stroke-width="2"/>
<text x="692" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">Texto para el generador</text>
<text x="692" y="612" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Si el registro se recupera, el prompt puede recibir</text>
<text x="692" y="647" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">los 900 tokens almacenados, incluido el sufijo.</text>
<rect x="65" y="770" width="1470" height="125" rx="18" fill="white" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="792" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">Qué demuestra la comparación</text>
<text x="87" y="837" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Si texto largo y prefijo producen la misma entrada, sus embeddings coinciden.</text>
<path d="M65,935 L1535,935" stroke="#CBD6E2" stroke-width="2" fill="none"/>
<text x="65" y="955" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">126 / 900 = 0,14 · El límite y los tokens especiales son supuestos del ejemplo, no valores universales.</text>
</svg>