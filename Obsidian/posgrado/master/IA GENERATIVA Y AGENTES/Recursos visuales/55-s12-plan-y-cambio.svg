<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">55 · Planificar primero exige manejar cambios</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Ejemplo de ventas: el plan depende de que existan datos comparables de marzo y abril.</text><rect x="55" y="175" width="370" height="370" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="71" y="214" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">PLANIFICADOR</text><text x="71" y="246" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">1. Consultar marzo</text><text x="71" y="278" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">2. Consultar abril</text><text x="71" y="310" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">3. Calcular variación</text><text x="71" y="342" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">4. Redactar con evidencia</text><rect x="560" y="175" width="360" height="160" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="576" y="214" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">EJECUTOR</text><text x="576" y="246" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Cumplir un paso</text><text x="576" y="278" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Registrar el resultado</text><polyline points="425,255 560,255" fill="none" stroke="#183247" stroke-width="3"/><polygon points="560,255 547.3937405670625,261.08951747755725 547.3937405670625,248.91048252244278" fill="#183247"/><rect x="560" y="450" width="360" height="145" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="576" y="489" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">¿PLAN AÚN VÁLIDO?</text><text x="576" y="521" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">No hay datos de abril.</text><text x="576" y="553" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">El cálculo no puede seguir.</text><polyline points="740,335 740,450" fill="none" stroke="#183247" stroke-width="3"/><polygon points="740,450 733.9104825224427,437.39374056706254 746.0895174775573,437.39374056706254" fill="#183247"/><rect x="1030" y="450" width="310" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="1046" y="488" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">REPLANIFICAR</text><text x="1046" y="519" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Pedir otro período</text><text x="1046" y="550" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">o declarar el límite</text><polyline points="920,520 1030,520" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1030,520 1017.3937405670625,526.0895174775573 1017.3937405670625,513.9104825224427" fill="#183247"/><polyline points="1185,595 1185,690 240,690 240,545" fill="none" stroke="#183247" stroke-width="3"/><polygon points="240,545 246.08951747755722,557.6062594329375 233.91048252244278,557.6062594329375" fill="#183247"/><text x="455" y="733" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">Máximo de replanes + presupuesto global</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">El esquema explica el mecanismo. No afirma una mejora medida de Plan-and-Execute.</text></svg>