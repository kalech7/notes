<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">62 · El punto conecta vector y documento</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Colección: declara dimensión y métrica. Cada punto añade identificador y payload.</text><rect x="55" y="170" width="580" height="210" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="210" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">PUNTO</text><text x="71" y="243" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">id: faq-17</text><text x="71" y="276" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">vector: [0,2; -0,1; ...]</text><text x="71" y="309" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">payload: texto, tema, fuente</text><rect x="770" y="170" width="570" height="210" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="786" y="210" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">CONSULTA</text><text x="786" y="243" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">vector de la pregunta</text><text x="786" y="276" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">filtro: tema = pagos</text><text x="786" y="309" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">límite de resultados: 2</text><polyline points="345,380 345,525" fill="none" stroke="#183247" stroke-width="3"/><polygon points="345,525 338.91048252244275,512.3937405670625 351.08951747755725,512.3937405670625" fill="#183247"/><rect x="55" y="525" width="580" height="150" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="71" y="565" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">SELECCIÓN</text><text x="71" y="598" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">El filtro define el subconjunto.</text><text x="71" y="631" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">La similitud ordena candidatos.</text><rect x="770" y="525" width="570" height="150" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="786" y="564" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">RESULTADO</text><text x="786" y="596" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">id + puntaje + payload permitido</text><text x="786" y="628" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Después se construye el contexto.</text><polyline points="1055,380 1055,450 345,450 345,525" fill="none" stroke="#183247" stroke-width="3"/><polygon points="345,525 338.91048252244275,512.3937405670625 351.08951747755725,512.3937405670625" fill="#183247"/><polyline points="635,600 770,600" fill="none" stroke="#183247" stroke-width="3"/><polygon points="770,600 757.3937405670625,606.0895174775573 757.3937405670625,593.9104825224427" fill="#183247"/><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Esquema propio. IDs y metadatos pueden apuntar a texto externo; el payload no crea significado.</text></svg>