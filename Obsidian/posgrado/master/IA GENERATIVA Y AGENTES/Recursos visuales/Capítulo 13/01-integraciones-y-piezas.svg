a y componentes a la derecha: son unidades diferentes.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Supuesto didáctico: cada aplicación usa cada sistema; se cuenta un proveedor por sistema.</text></svg>