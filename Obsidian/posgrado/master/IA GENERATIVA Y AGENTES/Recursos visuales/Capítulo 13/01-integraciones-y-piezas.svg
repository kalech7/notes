<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">01 · Producto de conexiones, suma de componentes</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Ejemplo conceptual: 3 aplicaciones y 4 sistemas. No es una medición de tiempo o costo.</text><text x="55" y="185" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">CONEXIONES PROPIAS: 3 × 4 = 12</text><text x="755" y="185" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">COMPONENTES REUTILIZABLES: 3 + 4 = 7</text><rect x="55" y="240" width="190" height="85" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="279" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Agente</text><rect x="55" y="385" width="190" height="85" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="424" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">IDE</text><rect x="55" y="530" width="190" height="85" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="569" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Soporte</text><rect x="440" y="220" width="200" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="456" y="258" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Ventas</text><rect x="440" y="335" width="200" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="456" y="373" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">RAG</text><rect x="440" y="450" width="200" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="456" y="488" font-family="Arial,sans-serif"