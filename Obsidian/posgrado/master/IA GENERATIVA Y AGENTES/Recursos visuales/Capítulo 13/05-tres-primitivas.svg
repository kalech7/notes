<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">05 · Acciones, datos y plantillas</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Las tres primitivas tienen funciones diferentes dentro de la aplicación.</text><text x="55" y="217" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183247">TOOLS</text><rect x="55" y="265" width="395" height="300" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="304" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">consultar_ventas(mes)</text><text x="71" y="336" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Una operación invocable</text><text x="71" y="368" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Devuelve resultado</text><text x="71" y="400" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Puede tener efectos</text><text x="500" y="217" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183247">RESOURCES</text><rect x="500" y="265" width="395" height="300" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="516" y="304" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">reporte://ventas/marzo</text><text x="516" y="336" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Contenido identificable</text><text x="516" y="368" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Se incorpora al contexto</text><text x="516" y="400" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">No es una orden</text><text x="945" y="217" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183247">PROMPTS</text><rect x="945" y="265" width="395" height="300" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="961" y="304" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">comparar_periodos</text><text x="961" y="336" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Plantilla reutilizable</text><text x="961" y="368" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Organiza mensajes</text><text x="961" y="400" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">No prueba una respuesta</text><rect x="140" y="635" width="1120" height="95" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="156" y="676" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#183247">El host decide qué capacidades usar y qué información llega al modelo.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Ejemplos propios. Un servidor puede ofrecer una o varias de estas categorías.</text></svg>