<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">06 · Tres agentes, tres criterios de comprobación</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">El mismo bucle puede trabajar con herramientas y evidencias diferentes.</text><text x="55" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">ANALISTA</text><rect x="300" y="180" width="510" height="125" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="316" y="219" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Consulta → cálculo → gráfico</text><polyline points="810,240 875,240" fill="none" stroke="#183247" stroke-width="3"/><polygon points="875,240 862.3937405670625,246.08951747755722 862.3937405670625,233.91048252244278" fill="#183247"/><rect x="875" y="180" width="470" height="125" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="891" y="218" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Recalcular sobre datos correctos</text><text x="55" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">CÓDIGO</text><rect x="300" y="355" width="510" height="125" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="316" y="394" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Archivos → ejecución → tests</text><polyline points="810,415 875,415" fill="none" stroke="#183247" stroke-width="3"/><polygon points="875,415 862.3937405670625,421.08951747755725 862.3937405670625,408.91048252244275" fill="#183247"/><rect x="875" y="355" width="470" height="125" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="891" y="393" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Comprobar casos y contrato</text><text x="55" y="560" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">INVESTIGACIÓN</text><rect x="300" y="530" width="510" height="125" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="316" y="569" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Búsqueda → fragmentos → informe</text><polyline points="810,590 875,590" fill="none" stroke="#183247" stroke-width="3"/><polygon points="875,590 862.3937405670625,596.0895174775573 862.3937405670625,583.9104825224427" fill="#183247"/><rect x="875" y="530" width="470" height="125" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="891" y="568" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Vincular afirmación y evidencia</text><rect x="120" y="720" width="1160" height="55" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="136" y="760" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Una respuesta coherente puede fallar la comprobación.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Tests deterministas no equivalen a cobertura completa; una cita tampoco demuestra causalidad.</text></svg>