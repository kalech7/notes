<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">07 · Del catálogo a una acción permitida</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Descubrir una capacidad inicia una decisión; no concede autorización sobre los datos.</text><rect x="100" y="175" width="1200" height="95" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="116" y="214" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">1. Descubrir catálogo</text><text x="116" y="246" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Identificar nombre, entrada y proveedor</text><polyline points="700,270 700,310" fill="none" stroke="#183247" stroke-width="3"/><polygon points="700,310 693.9104825224427,297.39374056706254 706.0895174775573,297.39374056706254" fill="#183247"/><rect x="100" y="310" width="1200" height="95" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="116" y="349" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">2. Seleccionar contrato</text><text x="116" y="381" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Ofrecer solo capacidades pertinentes</text><polyline points="700,405 700,445" fill="none" stroke="#183247" stroke-width="3"/><polygon points="700,445 693.9104825224427,432.39374056706254 706.0895174775573,432.39374056706254" fill="#183247"/><rect x="100" y="445" width="1200" height="95" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="116" y="484" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">3. Validar petición</text><text x="116" y="516" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Comprobar argumentos, alcance y permiso</text><polyline points="700,540 700,580" fill="none" stroke="#183247" stroke-width="3"/><polygon points="700,580 693.9104825224427,567.3937405670625 706.0895174775573,567.3937405670625" fill="#183247"/><rect x="100" y="580" width="1200" height="95" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="116" y="619" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">4. Ejecutar y registrar</text><text x="116" y="651" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Aplicar límites y guardar la evidencia</text><text x="100" y="769" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183247">La descripción externa informa sobre la tool; no cambia las reglas del host.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Ejemplo propio de responsabilidades. La política efectiva vive en controles de la aplicación y del servicio.</text></svg>