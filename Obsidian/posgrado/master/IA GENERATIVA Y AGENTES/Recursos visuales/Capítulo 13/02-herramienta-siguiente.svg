<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">02 · Añadir la herramienta siguiente</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">M=1 y N=3: 3 integraciones frente a 4 piezas. La ventaja buscada es cambiar menos código.</text><text x="55" y="200" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">REGISTRO FIJO</text><rect x="55" y="240" width="370" height="205" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="71" y="278" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Aparece convertir_moneda</text><text x="71" y="309" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Editar registro</text><text x="71" y="340" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Añadir contrato al modelo</text><text x="71" y="371" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Revisar despacho del agente</text><polyline points="425,340 555,340" fill="none" stroke="#183247" stroke-width="3"/><polygon points="555,340 542.3937405670625,346.08951747755725 542.3937405670625,333.91048252244275" fill="#183247"/><rect x="555" y="260" width="790" height="150" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="571" y="300" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">El conocimiento de las tools está en el agente.</text><text x="571" y="333" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">La nueva capacidad obliga a revisar esa dependencia.</text><text x="55" y="530" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">DESCUBRIMIENTO</text><rect x="55" y="565" width="370" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="71" y="603" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Publicar nueva capacidad</text><text x="71" y="634" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Configurar el servidor</text><text x="71" y="665" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Volver a descubrir catálogo</text><polyline points="425,635 555,635" fill="none" stroke="#183247" stroke-width="3"/><polygon points="555,635 542.3937405670625,641.0895174775573 542.3937405670625,628.9104825224427" fill="#183247"/><rect x="555" y="565" width="790" height="145" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="571" y="605" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">El cliente recibe el contrato y sabe a dónde enviarlo.</text><text x="571" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">El mismo agente consume el catálogo actualizado.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Cambiar configuración y probar el sistema sigue siendo necesario. El código del agente puede conservarse.</text></svg>