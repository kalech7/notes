<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">03 · Un host, dos clientes y dos servidores</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Un servidor puede publicar varias tools. El cliente MCP de cada servidor mantiene su frontera.</text><rect x="55" y="160" width="730" height="540" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="85" y="206" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">HOST · aplicación que coordina</text><rect x="85" y="255" width="300" height="220" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="101" y="295" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Modelo</text><text x="101" y="328" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Recibe herramientas</text><text x="101" y="361" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Propone nombre</text><text x="101" y="394" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">y argumentos</text><rect x="470" y="245" width="265" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="486" y="283" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Cliente A</text><text x="486" y="314" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Descubre y adapta</text><text x="486" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Enruta hacia ventas</text><rect x="470" y="485" width="265" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="486" y="523" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Cliente B</text><text x="486" y="554" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Descubre y adapta</text><text x="486" y="585" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Enruta hacia cambio</text><polyline points="385,315 470,315" fill="none" stroke="#183247" stroke-width="3"/><polygon points="470,315 457.39374056706254,321.08951747755725 457.39374056706254,308.91048252244275" fill="#183247"/><polyline points="385,435 425,435 425,555 470,555" fill="none" stroke="#183247" stroke-width="3"/><polygon points="470,555 457.39374056706254,561.0895174775573 457.39374056706254,548.9104825224427" fill="#183247"/><rect x="970" y="245" width="375" height="160" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="986" y="285" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Servidor A · ventas</text><text x="986" y="318" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">consultar_ventas</text><text x="986" y="351" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">estadisticas_ventas</text><rect x="970" y="485" width="375" height="160" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="986" y="525" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Servidor B · cambio</text><text x="986" y="558" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">convertir_moneda</text><text x="986" y="591" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Aquí se ejecuta la función</text><polyline points="735,315 970,315" fill="none" stroke="#183247" stroke-width="3"/><polygon points="970,315 957.3937405670625,321.08951747755725 957.3937405670625,308.91048252244275" fill="#183247"/><polyline points="735,555 970,555" fill="none" stroke="#183247" stroke-width="3"/><polygon points="970,555 957.3937405670625,561.0895174775573 957.3937405670625,548.9104825224427" fill="#183247"/><text x="70" y="744" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183247">La propuesta sale del modelo; la ejecución ocurre en código local o remoto.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">M cuenta aplicaciones. N debe definirse consistentemente como proveedores o sistemas de integración.</text></svg>