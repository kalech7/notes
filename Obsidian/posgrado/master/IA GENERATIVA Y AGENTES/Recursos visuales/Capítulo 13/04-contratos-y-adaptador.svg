<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">04 · Dos contratos y un adaptador</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">El contrato publicado debe convertirse al formato que espera la llamada al modelo.</text><rect x="55" y="180" width="360" height="220" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="71" y="222" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183247">SERVIDOR</text><text x="71" y="257" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183247">name</text><text x="71" y="292" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183247">description</text><text x="71" y="327" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183247">inputSchema</text><polyline points="415,290 525,290" fill="none" stroke="#183247" stroke-width="3"/><polygon points="525,290 512.3937405670625,296.08951747755725 512.3937405670625,283.91048252244275" fill="#183247"/><rect x="525" y="180" width="340" height="220" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="541" y="219" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">CLIENTE / ADAPTADOR</text><text x="541" y="251" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Validar catálogo</text><text x="541" y="283" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Traducir formato</text><text x="541" y="315" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Guardar ruta de ejecución</text><polyline points="865,290 975,290" fill="none" stroke="#183247" stroke-width="3"/><polygon points="975,290 962.3937405670625,296.08951747755725 962.3937405670625,283.91048252244275" fill="#183247"/><rect x="975" y="180" width="370" height="220" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="991" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">API DEL MODELO</text><text x="991" y="253" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Recibe contratos</text><text x="991" y="286" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Devuelve propuesta</text><text x="991" y="319" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">No ejecuta la función</text><rect x="55" y="520" width="600" height="145" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="560" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">FUNCTION CALLING</text><text x="71" y="593" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Modelo → aplicación</text><text x="71" y="626" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Cómo se expresa la petición</text><rect x="745" y="520" width="600" height="145" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="761" y="560" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">MCP</text><text x="761" y="593" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Cliente → servidor</text><text x="761" y="626" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Cómo se publica, descubre e invoca</text><text x="55" y="743" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">El catálogo llega al ejecutar. Un nombre descubierto necesita también una ruta de despacho.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">La ubicación del adaptador es una decisión arquitectónica del ejemplo, no una obligación de MCP.</text></svg>