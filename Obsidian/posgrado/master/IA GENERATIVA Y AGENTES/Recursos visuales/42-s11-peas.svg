<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183247">42 · PEAS aplicado a un asistente de ventas</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#526777">Primero especifica qué cuenta como éxito; después diseña el sistema.</text><rect x="55" y="160" width="1285" height="95" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="73" y="202" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">P · Desempeño: resultado correcto, evidencia trazable y uso limitado de recursos</text><rect x="55" y="320" width="310" height="245" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="73" y="362" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">E · Entorno</text><text x="73" y="395" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Base de ventas</text><text x="73" y="428" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Reglas del negocio</text><text x="73" y="461" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Archivos y usuario</text><rect x="500" y="310" width="350" height="120" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="518" y="352" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">S · Sensores</text><text x="518" y="385" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Pregunta y resultados</text><rect x="500" y="520" width="350" height="120" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="518" y="562" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">A · Actuadores</text><text x="518" y="595" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Consultas y respuesta</text><rect x="1010" y="340" width="330" height="250" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="1028" y="382" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">SISTEMA AGENTE</text><text x="1028" y="415" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">LLM: propone</text><text x="1028" y="448" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Harness: valida</text><text x="1028" y="481" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">y ejecuta</text><text x="1028" y="514" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Estado: historial</text><polyline points="365,370 500,370" fill="none" stroke="#183247" stroke-width="3"/><polygon points="500,370 486.49329346470984,376.52448301166845 486.49329346470984,363.47551698833155" fill="#183247"/><polyline points="850,370 1010,370" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1010,370 996.4932934647098,376.52448301166845 996.4932934647098,363.47551698833155" fill="#183247"/><polyline points="1010,570 850,570" fill="none" stroke="#183247" stroke-width="3"/><polygon points="850,570 863.5067065352902,563.4755169883315 863.5067065352902,576.5244830116685" fill="#183247"/><polyline points="500,570 210,570 210,565" fill="none" stroke="#183247" stroke-width="3"/><polygon points="210,565 216.52448301166845,578.5067065352902 203.47551698833155,578.5067065352902" fill="#183247"/><text x="65" y="725" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">El LLM recibe observaciones parciales; no ve toda la base de datos.</text><text x="55" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526777">Ejemplo propio. Las herramientas pueden percibir, actuar o hacer ambas cosas.</text></svg>