<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">56 · Contrato completo antes de ejecutar</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">La descripción ayuda a elegir; las restricciones efectivas las impone el programa.</text><rect x="55" y="160" width="600" height="155" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">1. Descubrir lo permitido</text><text x="71" y="229" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Nombre, descripción y esquema de datos.</text><rect x="745" y="160" width="600" height="155" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="761" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">2. Validar propuesta</text><text x="761" y="229" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Campos, tipos, dominio y permisos.</text><rect x="745" y="430" width="600" height="155" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="761" y="468" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">3. Ejecutar con límites</text><text x="761" y="499" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Filas máximas, tiempo y ruta autorizada.</text><rect x="55" y="430" width="600" height="155" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="468" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">4. Devolver y registrar</text><text x="71" y="499" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">Resultado o error útil; id y latencia.</text><polyline points="655,235 745,235" fill="none" stroke="#183247" stroke-width="3"/><polygon points="745,235 732.3937405670625,241.08951747755722 732.3937405670625,228.91048252244278" fill="#183247"/><polyline points="1045,315 1045,430" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1045,430 1038.9104825224429,417.39374056706254 1051.0895174775571,417.39374056706254" fill="#183247"/><polyline points="745,505 655,505" fill="none" stroke="#183247" stroke-width="3"/><polygon points="655,505 667.6062594329375,498.91048252244275 667.6062594329375,511.08951747755725" fill="#183247"/><text x="65" y="688" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">SQL: el esquema informa qué existe; permisos y validación limitan qué puede hacerse.</text><text x="65" y="738" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Un error útil: tabla desconocida. Tablas disponibles: sales, products, customers.</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Nombres de tablas ilustrativos. No se inspeccionó el Lab 03 citado por las diapositivas.</text></svg>