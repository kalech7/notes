<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183247">43 · Una llamada recorre tres participantes</text><text x="55" y="109" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#526777">El identificador c1 permite emparejar la solicitud con su resultado.</text><rect x="100" y="145" width="230" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="118" y="187" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">LLM</text><polyline points="215,230 215,730" fill="none" stroke="#b4c3ce" stroke-width="2"/><rect x="565" y="145" width="230" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="583" y="187" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Harness / código</text><polyline points="680,230 680,730" fill="none" stroke="#b4c3ce" stroke-width="2"/><rect x="1090" y="145" width="230" height="75" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="1108" y="187" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183247">Herramienta</text><polyline points="1205,230 1205,730" fill="none" stroke="#b4c3ce" stroke-width="2"/><polyline points="215,300 680,300" fill="none" stroke="#183247" stroke-width="3"/><polygon points="680,300 666.4932934647098,306.52448301166845 666.4932934647098,293.47551698833155" fill="#183247"/><text x="225" y="280" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">1. c1: total_ventas(mes)</text><polyline points="680,400 1205,400" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1205,400 1191.49329346471,406.52448301166845 1191.49329346471,393.47551698833155" fill="#183247"/><text x="690" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">2. Validar y ejecutar</text><polyline points="1205,500 680,500" fill="none" stroke="#183247" stroke-width="3"/><polygon points="680,500 693.5067065352902,493.47551698833155 693.5067065352902,506.52448301166845" fill="#183247"/><text x="690" y="480" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">3. Devuelve 15000 USD</text><polyline points="680,600 215,600" fill="none" stroke="#183247" stroke-width="3"/><polygon points="215,600 228.50670653529016,593.4755169883315 228.50670653529016,606.5244830116685" fill="#183247"/><text x="225" y="580" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183247">4. Resultado de c1 al contexto</text><text x="80" y="704" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183247">5. Nueva decisión: otra llamada o respuesta final</text><text x="55" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526777">Una llamada fallida también debe obtener un resultado: un error estructurado y asociado a su id.</text></svg>