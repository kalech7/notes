<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">61 · La dimensión se paga en memoria</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Un millón de vectores float32; 4 bytes por coordenada; GB decimales.</text><text x="55" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">d = 384</text><rect x="320" y="190" width="92.16" height="48" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="437.15999999999997" y="221" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">1.536 GB</text><text x="55" y="336" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">d = 1024</text><rect x="320" y="310" width="245.76000000000002" height="48" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="590.76" y="341" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">4.096 GB</text><text x="55" y="456" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">d = 1536</text><rect x="320" y="430" width="368.64" height="48" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="713.64" y="461" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">6.144 GB</text><text x="55" y="576" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183247">d = 3072</text><rect x="320" y="550" width="737.28" height="48" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="1082.28" y="581" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">12.288 GB</text><text x="315.0" y="725" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">0</text><text x="495.0" y="725" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">3</text><text x="675.0" y="725" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">6</text><text x="855.0" y="725" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">9</text><text x="1035.0" y="725" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183247">12</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Solo vectores: faltan grafo/listas, IDs, payload, metadatos y sobrecarga. 3072/384 = 8.</text></svg>