<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#F4F7FB"/>
<text x="65" y="45" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">¿Dónde está disponible la respuesta?</text>
<text x="65" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">Una misma pregunta puede ser respondible en los originales y carecer de evidencia en el prompt.</text>
<rect x="65" y="185" width="1470" height="145" rx="18" fill="#DFEBFB" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="207" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">1. Corpus original</text>
<text x="87" y="252" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Reglamento + instructivo escaneado + guías</text>
<path d="M95,338 L95,365" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M95,365 L87.80861692093696,351.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M95,365 L102.19138307906304,351.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<rect x="65" y="375" width="1160" height="145" rx="18" fill="#DCEFEA" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="397" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">2. Contenido indexado</text>
<text x="87" y="442" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">El escaneo no aportó texto al índice</text>
<path d="M95,528 L95,555" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M95,555 L87.80861692093696,541.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<path d="M95,555 L102.19138307906304,541.8362615716444" stroke="#2563A5" stroke-width="4" fill="none"/>
<rect x="65" y="565" width="850" height="145" rx="18" fill="#FFF0D9" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="587" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">3. Contexto de la consulta</text>
<text x="87" y="632" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Solo los fragmentos seleccionados para el prompt</text>
<text x="1250" y="405" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">Pérdida de ingesta</text>
<text x="990" y="597" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">Pérdida de selección</text>
<rect x="65" y="770" width="1470" height="125" rx="18" fill="white" stroke="#CBD6E2" stroke-width="2"/>
<text x="87" y="792" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2563A5" dominant-baseline="text-before-edge">Dos evaluaciones compatibles</text>
<text x="87" y="837" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Medir prudencia ante evidencia ausente y, por separado, la cobertura perdida por el sistema.</text>
<path d="M65,935 L1535,935" stroke="#CBD6E2" stroke-width="2" fill="none"/>
<text x="65" y="955" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">Tamaños esquemáticos, sin porcentajes · Declara respecto de qué corpus defines las preguntas negativas.</text>
</svg>