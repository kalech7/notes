<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">53 · ReAct dentro; Reflexion entre intentos</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">La crítica cambia el contexto del intento siguiente; los pesos pueden permanecer fijos.</text><rect x="55" y="160" width="1290" height="550" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="80" y="210" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183247">BUCLE EXTERNO · Reflexion</text><rect x="100" y="280" width="295" height="175" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="116" y="317" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Intento 1</text><text x="116" y="347" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">ReAct o generación</text><text x="116" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Producir trayectoria</text><rect x="550" y="280" width="295" height="175" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="566" y="317" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Evaluador</text><text x="566" y="347" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Comprobar contrato</text><text x="566" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Aprobado / rechazado</text><rect x="1000" y="280" width="295" height="175" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="1016" y="317" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Reflexión</text><text x="1016" y="347" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Explicar el fallo</text><text x="1016" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Guardar lección</text><polyline points="395,365 550,365" fill="none" stroke="#183247" stroke-width="3"/><polygon points="550,365 537.3937405670625,371.08951747755725 537.3937405670625,358.91048252244275" fill="#183247"/><polyline points="845,365 1000,365" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1000,365 987.3937405670625,371.08951747755725 987.3937405670625,358.91048252244275" fill="#183247"/><text x="865" y="353" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">si falla</text><polyline points="1145,455 1145,600 250,600 250,455" fill="none" stroke="#183247" stroke-width="3"/><polygon points="250,455 256.08951747755725,467.60625943293746 243.91048252244278,467.60625943293746" fill="#183247"/><text x="340" y="643" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183247">Nuevo intento con la crítica anterior</text><polyline points="695,280 695,240 1260,240" fill="none" stroke="#183247" stroke-width="3"/><polygon points="1260,240 1247.3937405670624,246.08951747755722 1247.3937405670624,233.91048252244278" fill="#183247"/><text x="835" y="225" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#183247">Si aprueba: termina</text><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">El dibujo omite el máximo de intentos para claridad: el laboratorio sí lo comprueba en código.</text></svg>