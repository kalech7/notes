<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#F4F7FB"/>
<text x="65" y="45" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">Abstención: dos decisiones, dos denominadores</text>
<text x="65" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">Responder requiere además comprobar corrección, fidelidad y completitud.</text>
<text x="440" y="190" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">EL SISTEMA RESPONDE</text>
<text x="1030" y="190" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">EL SISTEMA SE ABSTIENE</text>
<text x="65" y="322" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">RESPONDIBLE</text>
<text x="65" y="365" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Hay evidencia</text>
<text x="65" y="610" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">NEGATIVA</text>
<text x="65" y="653" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">No hay evidencia</text>
<rect x="395" y="265" width="535" height="230" rx="18" fill="#E2F3EE" stroke="#CBD6E2" stroke-width="2"/>
<text x="417" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#147D73" dominant-baseline="text-before-edge">Decisión potencialmente útil</text>
<text x="417" y="332" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Aún hay que revisar la respuesta.</text>
<text x="417" y="367" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">En el ejemplo: 6 de 8 casos.</text>
<rect x="975" y="265" width="560" height="230" rx="18" fill="#FBECEE" stroke="#CBD6E2" stroke-width="2"/>
<text x="997" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">Abstención indebida</text>
<text x="997" y="332" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Se pierde una respuesta posible.</text>
<text x="997" y="367" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">2 / 8 = 25 % de respondibles.</text>
<rect x="395" y="545" width="535" height="230" rx="18" fill="#FBECEE" stroke="#CBD6E2" stroke-width="2"/>
<text x="417" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#A63E45" dominant-baseline="text-before-edge">Respuesta sin soporte suficiente</text>
<text x="417" y="612" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Puede inventar información.</text>
<text x="417" y="647" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">En el ejemplo: 1 de 2 casos.</text>
<rect x="975" y="545" width="560" height="230" rx="18" fill="#E2F3EE" stroke="#CBD6E2" stroke-width="2"/>
<text x="997" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#147D73" dominant-baseline="text-before-edge">Abstención correcta</text>
<text x="997" y="612" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">Reconoce falta de evidencia.</text>
<text x="997" y="647" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#193249" dominant-baseline="text-before-edge">1 / 2 = 50 % de negativas.</text>
<text x="65" y="840" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193249" dominant-baseline="text-before-edge">Siempre abstenerse: 100 % correcta sobre negativas Y 100 % indebida sobre respondibles.</text>
<path d="M65,935 L1535,935" stroke="#CBD6E2" stroke-width="2" fill="none"/>
<text x="65" y="955" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#506479" dominant-baseline="text-before-edge">Ejemplo inventado: 8 respondibles + 2 negativas · Las etiquetas dependen del corpus de referencia declarado.</text>
</svg>