<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#fafcfe"/><text x="55" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183247">57 · IVF puede perder el vecino al otro lado</text><text x="55" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183247">Ejemplo 1D: dos centroides; la consulta elige primero la celda derecha.</text><rect x="55" y="170" width="600" height="260" rx="12" fill="#dcecf7" stroke="#183247" stroke-width="2"/><text x="71" y="209" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">CELDA IZQUIERDA</text><text x="71" y="241" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Centroide: -1</text><text x="71" y="273" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Vecino A: -0,05</text><text x="71" y="305" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Distancia a consulta: 0,15</text><rect x="745" y="170" width="600" height="260" rx="12" fill="#fff0d6" stroke="#183247" stroke-width="2"/><text x="761" y="209" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">CELDA DERECHA</text><text x="761" y="241" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Centroide: +1</text><text x="761" y="273" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Consulta: +0,10; vecino B: +0,50</text><text x="761" y="305" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Distancia a B: 0,40</text><rect x="55" y="520" width="600" height="155" rx="12" fill="#fbe2df" stroke="#183247" stroke-width="2"/><text x="71" y="559" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">nprobe = 1</text><text x="71" y="591" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Solo se busca en la celda derecha.</text><text x="71" y="623" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Devuelve B y pierde A.</text><rect x="745" y="520" width="600" height="155" rx="12" fill="#dff2e9" stroke="#183247" stroke-width="2"/><text x="761" y="559" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">nprobe = 2</text><text x="761" y="591" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Se buscan ambas celdas.</text><text x="761" y="623" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183247">Devuelve A, el más cercano.</text><polyline points="655,590 745,590" fill="none" stroke="#183247" stroke-width="3"/><polygon points="745,590 732.3937405670625,596.0895174775573 732.3937405670625,583.9104825224427" fill="#183247"/><text x="55" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#183247">Distancias euclídeas en 1D. La cercanía al centroide no garantiza la cercanía a cada punto.</text></svg>