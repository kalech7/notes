<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570">
<rect width="960" height="570" rx="20" fill="#f5f7fb"/>
<text x="40" y="48" font-family="Arial" font-size="28" font-weight="bold" fill="#14213d">¿Cuál es el punto más cercano al centroide?</text>
<text x="40" y="80" font-family="Arial" font-size="17" fill="#475569">Tres centros del mismo grupo · coordenadas de ejemplo en un plano</text>
<g stroke="#d8dee9" stroke-width="1">
<path d="M100 460H470 M100 360H470 M100 260H470 M100 160H470 M130 140V480 M230 140V480 M330 140V480 M430 140V480"/>
</g><g stroke="#64748b" stroke-width="2"><path d="M100 460H480 M130 480V125"/></g>
<g font-family="Arial" font-size="14" fill="#64748b"><text x="122" y="504">0</text><text x="225" y="504">1</text><text x="325" y="504">2</text><text x="485" y="465">X</text><text x="124" y="115">Y</text><text x="98" y="365">1</text><text x="98" y="265">2</text><text x="98" y="165">3</text></g>
<g stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 5"><path d="M230 360L130 460 M230 360L330 460 M230 360L230 160"/></g>
<g fill="#2563eb"><circle cx="130" cy="460" r="8"/><circle cx="330" cy="460" r="8"/><circle cx="230" cy="160" r="8"/></g>
<circle cx="230" cy="360" r="9" fill="#d97706" stroke="white" stroke-width="3"/>
<g font-family="Arial" font-size="18" font-weight="bold" fill="#14213d"><text x="145" y="449">A (0,0)</text><text x="345" y="449">B (2,0)</text><text x="248" y="165">C (1,3)</text><text x="246" y="349">Centroide (1,1)</text></g>
<rect x="540" y="135" width="380" height="330" rx="16" fill="white" stroke="#d8dee9"/>
<g font-family="Arial" fill="#14213d"><text x="565" y="175" font-size="21" font-weight="bold">Primero promediar</text>
<text x="565" y="213" font-size="18">X: (0 + 2 + 1) / 3 = 1</text><text x="565" y="243" font-size="18">Y: (0 + 0 + 3) / 3 = 1</text>
<text x="565" y="290" font-size="21" font-weight="bold">Después comparar distancias</text>
<text x="565" y="329" font-size="18">A y B: √2 ≈ 1,414 · empate</text><text x="565" y="359" font-size="18">C: 2 · más lejos</text>
<text x="565" y="405" font-size="17">RANK por distancia: A y B</text><text x="565" y="434" font-size="17">ROW_NUMBER + ID: A</text></g>
<text x="40" y="545" font-family="Arial" font-size="16" fill="#475569">El centroide no es un centro real. El ganador depende de cómo resuelvas los empates.</text>
</svg>