<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<title>De una frase del negocio a una decisión verificable</title><desc>Ejemplo propio de PedidoClaro. Los números son hipótesis para negociar y validar.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007f83" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="760" fill="#f6f8f8"/>
<text x="48" y="57" font-size="32" fill="#16324f" font-weight="700" text-anchor="start">De una frase del negocio a una decisión verificable</text>
<text x="48" y="92" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo propio de PedidoClaro. Los números son hipótesis para negociar y validar.</text>
<line x1="48" y1="117" x2="1152" y2="117" stroke="#ccd8df" stroke-width="1"/>
<rect x="95" y="145" width="1005" height="85" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="115" y="179" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">1 · NECESIDAD</text>
<text x="115" y="211" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Durante el almuerzo no podemos perder pedidos.</text>
<line x1="600" y1="230" x2="600" y2="249" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="251" width="1005" height="85" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="115" y="285" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">2 · ESCENARIO</text>
<text x="115" y="317" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Llegan 100 solicitudes/s durante 15 minutos.</text>
<line x1="600" y1="336" x2="600" y2="355" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="357" width="1005" height="85" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="115" y="391" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">3 · CAPACIDADES</text>
<text x="115" y="423" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Disponibilidad · elasticidad · integridad de pedidos</text>
<line x1="600" y1="442" x2="600" y2="461" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="463" width="1005" height="85" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="115" y="497" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">4 · DECISIÓN</text>
<text x="115" y="529" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Registrar antes de confirmar; aislar el fallo de mapas.</text>
<line x1="600" y1="548" x2="600" y2="567" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="569" width="1005" height="85" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="115" y="603" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">5 · EVIDENCIA</text>
<text x="115" y="635" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Prueba de pico + caída de mapas + conciliación de pedidos</text>
<text x="96" y="690" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Registrar también alternativas, costos, responsables y condición para revisar la decisión.</text>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">La trazabilidad permite comprobar el porqué; elegir una tecnología por nombre no completa este recorrido.</text>
</g></svg>