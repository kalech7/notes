<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="context-stroke"/></marker><marker id="start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="context-stroke"/></marker></defs><rect width="1400" height="680" fill="white"/><g font-family="Arial, sans-serif"><text x="55" y="54" text-anchor="start" fill="#23364a" font-size="32">Cobertura, comprobación y detección no son equivalentes</text><text x="55" y="91" text-anchor="start" fill="#566673" font-size="20">Ampliación del argumento de testabilidad de las pp. 86 y 92</text><rect x="80" y="185" width="350" height="115" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="255.0" y="236.0" text-anchor="middle" fill="#23364a" font-size="24">Ejecutar una línea</text><text x="255.0" y="265.0" text-anchor="middle" fill="#23364a" font-size="24">Cobertura</text><rect x="520" y="185" width="350" height="115" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="695.0" y="236.0" text-anchor="middle" fill="#23364a" font-size="24">Comprobar un resultado</text><text x="695.0" y="265.0" text-anchor="middle" fill="#23364a" font-size="24">Aserción</text><rect x="960" y="185" width="350" height="115" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="1135.0" y="236.0" text-anchor="middle" fill="#23364a" font-size="24">Detectar un defecto</text><text x="1135.0" y="265.0" text-anchor="middle" fill="#23364a" font-size="24">Confianza útil</text><path d="M430,242 L520,242" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><path d="M870,242 L960,242" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="352" text-anchor="middle" fill="#23364a" font-size="22">Las flechas indican pasos necesarios en este ejemplo; ninguno garantiza por sí solo el siguiente.</text><rect x="80" y="450" width="555" height="125" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="357.5" y="491.5" text-anchor="middle" fill="#23364a" font-size="24">Prueba débil</text><text x="357.5" y="520.5" text-anchor="middle" fill="#23364a" font-size="24">calcularTotal(2, 10)</text><text x="357.5" y="549.5" text-anchor="middle" fill="#23364a" font-size="24">La llamada ocurre, pero nada se verifica.</text><rect x="715" y="450" width="595" height="125" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="1012.5" y="491.5" text-anchor="middle" fill="#23364a" font-size="24">Prueba útil</text><text x="1012.5" y="520.5" text-anchor="middle" fill="#23364a" font-size="24">assert calcularTotal(2, 10) == 20</text><text x="1012.5" y="549.5" text-anchor="middle" fill="#23364a" font-size="24">Un resultado incorrecto hace fallar la prueba.</text><text x="55" y="655" text-anchor="start" fill="#566673" font-size="18">Capítulo 6 · Recreación didáctica propia a partir del PDF proporcionado</text></g></svg>