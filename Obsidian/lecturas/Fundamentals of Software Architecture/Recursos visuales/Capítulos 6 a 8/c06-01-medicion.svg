<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="context-stroke"/></marker><marker id="start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="context-stroke"/></marker></defs><rect width="1400" height="710" fill="white"/><g font-family="Arial, sans-serif"><text x="55" y="54" text-anchor="start" fill="#23364a" font-size="32">De una palabra ambigua a una decisión verificable</text><text x="55" y="91" text-anchor="start" fill="#566673" font-size="20">Ampliación didáctica · el ciclo no es una figura literal del libro</text><rect x="65" y="160" width="330" height="100" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="230.0" y="203.5" text-anchor="middle" fill="#23364a" font-size="24">Necesidad</text><text x="230.0" y="232.5" text-anchor="middle" fill="#23364a" font-size="24">«Cambiar con rapidez»</text><rect x="530" y="160" width="330" height="100" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="695.0" y="203.5" text-anchor="middle" fill="#23364a" font-size="24">Descomposición</text><text x="695.0" y="232.5" text-anchor="middle" fill="#23364a" font-size="24">Pruebas + despliegue</text><rect x="995" y="160" width="330" height="100" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="1160.0" y="203.5" text-anchor="middle" fill="#23364a" font-size="24">Definición observable</text><text x="1160.0" y="232.5" text-anchor="middle" fill="#23364a" font-size="24">Tiempo + éxito + fallos</text><path d="M395,210 L530,210" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><path d="M860,210 L995,210" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="405" width="330" height="120" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="1160.0" y="444.0" text-anchor="middle" fill="#23364a" font-size="23">Escenario y umbral</text><text x="1160.0" y="473.0" text-anchor="middle" fill="#23364a" font-size="23">Qué, dónde, cuándo</text><text x="1160.0" y="502.0" text-anchor="middle" fill="#23364a" font-size="23">y cuánto</text><rect x="530" y="405" width="330" height="120" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="695.0" y="458.5" text-anchor="middle" fill="#23364a" font-size="24">Evidencia</text><text x="695.0" y="487.5" text-anchor="middle" fill="#23364a" font-size="24">Medir y comparar</text><rect x="65" y="405" width="330" height="120" rx="12" fill="#eef3f6" stroke="#23364a" stroke-width="2.5"/><text x="230.0" y="444.0" text-anchor="middle" fill="#23364a" font-size="23">Decisión</text><text x="230.0" y="473.0" text-anchor="middle" fill="#23364a" font-size="23">Corregir o revisar</text><text x="230.0" y="502.0" text-anchor="middle" fill="#23364a" font-size="23">el criterio</text><path d="M1160,260 L1160,405" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><path d="M995,465 L860,465" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><path d="M530,465 L395,465" fill="none" stroke="#23364a" stroke-width="3" marker-end="url(#arrow)"/><path d="M230,405 L230,325 L695,325 L695,260" fill="none" stroke="#2f6780" stroke-width="3" marker-end="url(#arrow)"/><text x="695" y="620" text-anchor="middle" fill="#23364a" font-size="24">La flecha de retorno recuerda que una métrica también puede estar mal definida.</text><text x="55" y="685" text-anchor="start" fill="#566673" font-size="18">Capítulo 6 · Recreación didáctica propia a partir del PDF proporcionado</text></g></svg>