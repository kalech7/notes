<text x="675" y="241" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">I = 0,20; A = 0,10; D = 0,70</text>
<text x="675" y="269" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Zona de dolor: investigar rigidez</text>
<rect x="655" y="322" width="485" height="117" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="675" y="356" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">B · sobre la secuencia</text>
<text x="675" y="388" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">I = 0,20; A = 0,80; D = 0,00</text>
<text x="675" y="416" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">A + I = 1; no demuestra buen dominio</text>
<rect x="655" y="469" width="485" height="117" rx="18" fill="#ffffff" stroke="#ae6a06" stroke-width="2"/>
<text x="675" y="503" font-size="23" fill="#ae6a06" font-weight="700" text-anchor="start">U · abstracto y poco dependido</text>
<text x="675" y="535" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">I = 0,85; A = 0,90; D = 0,75</text>
<text x="675" y="563" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Zona de inutilidad: revisar abstracciones</text>
<text x="655" y="630" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">D = |A + I − 1|  (distancia normalizada)</text>
<text x="655" y="663" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Distancia perpendicular geométrica = D / √2</text>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">A = Na / (Na + Nc). Se cuentan tipos abstractos y concretos; no se cuentan líneas de código.</text>
