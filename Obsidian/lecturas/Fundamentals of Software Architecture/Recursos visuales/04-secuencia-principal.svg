<text x="602" y="645" font-size="23" fill="#16324f" font-weight="700" text-anchor="start">I</text>
<text x="280" y="685" font-size="20" fill="#16324f" font-weight="400" text-anchor="start">I = Ce / (Ca + Ce)</text>
