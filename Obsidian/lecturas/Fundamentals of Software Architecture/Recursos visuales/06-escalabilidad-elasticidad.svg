<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<title>Escalabilidad y elasticidad responden preguntas diferentes</title><desc>Datos sintéticos para aprender a leer capacidad y demanda; no son mediciones de un sistema real.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007f83" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="760" fill="#f6f8f8"/>
<text x="48" y="57" font-size="32" fill="#16324f" font-weight="700" text-anchor="start">Escalabilidad y elasticidad responden preguntas diferentes</text>
<text x="48" y="92" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Datos sintéticos para aprender a leer capacidad y demanda; no son mediciones de un sistema real.</text>
<line x1="48" y1="117" x2="1152" y2="117" stroke="#ccd8df" stroke-width="1"/>
<text x="65" y="166" font-size="24" fill="#2463a5" font-weight="700" text-anchor="start">ESCALABILIDAD</text>
<text x="650" y="166" font-size="24" fill="#007f83" font-weight="700" text-anchor="start">ELASTICIDAD</text>
<text x="65" y="199" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">¿Cuánto trabajo admito al añadir recursos?</text>
<text x="650" y="199" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">¿Cómo adapto los recursos al cambiar la carga?</text>
<line x1="100" y1="565" x2="545" y2="565" stroke="#16324f" stroke-width="2"/>
<line x1="100" y1="565" x2="100" y2="250" stroke="#16324f" stroke-width="2"/>
<line x1="670" y1="565" x2="1118" y2="565" stroke="#16324f" stroke-width="2"/>
