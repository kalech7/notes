<text x="768" y="598" font-size="17" fill="#16324f" font-weight="400" text-anchor="middle">10 h</text>
<text x="851" y="598" font-size="17" fill="#16324f" font-weight="400" text-anchor="middle">12 h</text>
<text x="934" y="598" font-size="17" fill="#16324f" font-weight="400" text-anchor="middle">14 h</text>
<text x="1017" y="598" font-size="17" fill="#16324f" font-weight="400" text-anchor="middle">16 h</text>
<text x="1100" y="598" font-size="17" fill="#16324f" font-weight="400" text-anchor="middle">18 h</text>
<text x="656" y="570.0" font-size="16" fill="#16324f" font-weight="400" text-anchor="end">0</text>
<text x="656" y="445.0" font-size="16" fill="#16324f" font-weight="400" text-anchor="end">50</text>
<text x="656" y="320.0" font-size="16" fill="#16324f" font-weight="400" text-anchor="end">100</text>
<text x="700" y="237" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Solicitudes/s equivalentes</text>
<line x1="680" y1="632" x2="720" y2="632" stroke="#007f83" stroke-width="4"/>
<text x="732" y="639" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Demanda</text>
<line x1="875" y1="632" x2="915" y2="632" stroke="#2463a5" stroke-width="4" stroke-dasharray="8 7"/>
<text x="927" y="639" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Capacidad</text>
<text x="650" y="670" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Importan el tiempo de reacción y el costo ocioso.</text>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">Escalar preserva objetivos bajo más carga; elasticidad ajusta recursos hacia arriba y hacia abajo.</text>
</g></svg>