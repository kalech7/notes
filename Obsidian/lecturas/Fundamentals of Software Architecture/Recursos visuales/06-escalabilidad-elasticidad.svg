<rect x="129" y="475.0" width="72" height="90.0" rx="5" fill="#d4e8f5" stroke="#2463a5" stroke-width="2"/>
<text x="165" y="457.0" font-size="20" fill="#2463a5" font-weight="700" text-anchor="middle">100</text>
<text x="165" y="598" font-size="20" fill="#16324f" font-weight="400" text-anchor="middle">1</text>
<rect x="284" y="403.0" width="72" height="162.0" rx="5" fill="#d4e8f5" stroke="#2463a5" stroke-width="2"/>
<text x="320" y="385.0" font-size="20" fill="#2463a5" font-weight="700" text-anchor="middle">180</text>
<text x="320" y="598" font-size="20" fill="#16324f" font-weight="400" text-anchor="middle">2</text>
<rect x="439" y="295.0" width="72" height="270.0" rx="5" fill="#d4e8f5" stroke="#2463a5" stroke-width="2"/>
<text x="475" y="277.0" font-size="20" fill="#2463a5" font-weight="700" text-anchor="middle">300</text>
<text x="475" y="598" font-size="20" fill="#16324f" font-weight="400" text-anchor="middle">4</text>
<text x="115" y="237" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Capacidad (solicitudes/s)</text>
<text x="265" y="633" font-size="20" fill="#16324f" font-weight="400" text-anchor="start">Instancias</text>
<text x="85" y="670" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Añadir 4× recursos no garantiza 4× capacidad.</text>
<polyline points="685,515.0 768,490.0 851,290.0 934,290.0 1017,490.0 1100,515.0" fill="none" stroke="#2463a5" stroke-width="4" stroke-dasharray="9 5"/>
<polyline points="685,540.0 768,515.0 851,315.0 934,465.0 1017,515.0 1100,540.0" fill="none" stroke="#007f83" stroke-width="4"/>
