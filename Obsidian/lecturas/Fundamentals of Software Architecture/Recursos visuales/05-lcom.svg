<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<title>LCOM: seguir qué métodos comparten estado</title><desc>Clase hipotética con cuatro métodos, dos campos y seis pares distintos de métodos.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007f83" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="760" fill="#f6f8f8"/>
<text x="48" y="57" font-size="32" fill="#16324f" font-weight="700" text-anchor="start">LCOM: seguir qué métodos comparten estado</text>
<text x="48" y="92" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Clase hipotética con cuatro métodos, dos campos y seis pares distintos de métodos.</text>
<line x1="48" y1="117" x2="1152" y2="117" stroke="#ccd8df" stroke-width="1"/>
<rect x="60" y="155" width="550" height="430" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="85" y="196" font-size="24" fill="#2463a5" font-weight="700" text-anchor="start">Una clase, dos grupos de estado</text>
<rect x="92" y="223" width="125" height="58" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="112" y="257" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">m1</text>
<rect x="92" y="293" width="125" height="58" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="112" y="327" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">m2</text>
<rect x="92" y="413" width="125" height="58" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="112" y="447" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">m3</text>
<rect x="92" y="483" width="125" height="58" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="112" y="517" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">m4</text>
<rect x="425" y="260" width="130" height="60" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="445" y="294" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">a</text>
<rect x="425" y="450" width="130" height="60" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="445" y="484" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">b</text>
<line x1="217" y1="252" x2="425" y2="290" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="217" y1="322" x2="425" y2="290" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="217" y1="442" x2="425" y2="480" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="217" y1="512" x2="425" y2="480" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="655" y="155" width="485" height="126" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="675" y="189" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">Q = 2 pares con estado compartido</text>
<text x="675" y="221" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">(m1, m2) comparten a</text>
<text x="675" y="249" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">(m3, m4) comparten b</text>
<rect x="655" y="314" width="485" height="126" rx="18" fill="#ffffff" stroke="#b84640" stroke-width="2"/>
<text x="675" y="348" font-size="23" fill="#b84640" font-weight="700" text-anchor="start">P = 4 pares sin estado compartido</text>
<text x="675" y="380" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">(m1, m3), (m1, m4),</text>
<text x="675" y="408" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">(m2, m3), (m2, m4)</text>
<rect x="655" y="473" width="485" height="113" rx="18" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
<text x="675" y="507" font-size="23" fill="#16324f" font-weight="700" text-anchor="start">LCOM1 = max(P − Q, 0)</text>
<text x="675" y="539" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">max(4 − 2, 0) = 2</text>
<text x="80" y="635" font-size="23" fill="#16324f" font-weight="700" text-anchor="start">Separar puede ayudar si también hay dos responsabilidades distintas.</text>
<text x="80" y="673" font-size="20" fill="#16324f" font-weight="400" text-anchor="start">Los dos grupos conexos coinciden aquí con 2, pero LCOM1 no cuenta grupos.</text>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo propio. No confundir LCOM1 con otras variantes; compartir campos no prueba cohesión semántica.</text>
</g></svg>