<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<title>Recuperación: cuánto tiempo y cuántos datos</title><desc>Incidente hipotético. Los resultados observados se comparan después con los objetivos RTO y RPO.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007f83" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="760" fill="#f6f8f8"/>
<text x="48" y="57" font-size="32" fill="#16324f" font-weight="700" text-anchor="start">Recuperación: cuánto tiempo y cuántos datos</text>
<text x="48" y="92" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Incidente hipotético. Los resultados observados se comparan después con los objetivos RTO y RPO.</text>
<line x1="48" y1="117" x2="1152" y2="117" stroke="#ccd8df" stroke-width="1"/>
<line x1="140" y1="385" x2="1080" y2="385" stroke="#16324f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="185" y1="355" x2="185" y2="415" stroke="#2463a5" stroke-width="3"/>
<circle cx="185" cy="385" r="8" fill="#2463a5" stroke="white" stroke-width="2"/>
<text x="200" y="375" font-size="20" fill="#2463a5" font-weight="600" text-anchor="start"></text>
<text x="185" y="454" font-size="25" fill="#2463a5" font-weight="700" text-anchor="middle">10:00</text>
<text x="185" y="492" font-size="19" fill="#2463a5" font-weight="600" text-anchor="middle">Último punto recuperable</text>
<line x1="425" y1="355" x2="425" y2="415" stroke="#b84640" stroke-width="3"/>
<circle cx="425" cy="385" r="8" fill="#b84640" stroke="white" stroke-width="2"/>
<text x="440" y="375" font-size="20" fill="#b84640" font-weight="600" text-anchor="start"></text>
<text x="425" y="454" font-size="25" fill="#b84640" font-weight="700" text-anchor="middle">10:05</text>
<text x="425" y="492" font-size="19" fill="#b84640" font-weight="600" text-anchor="middle">Fallo</text>
<line x1="1030" y1="355" x2="1030" y2="415" stroke="#007f83" stroke-width="3"/>
<circle cx="1030" cy="385" r="8" fill="#007f83" stroke="white" stroke-width="2"/>
<text x="1045" y="375" font-size="20" fill="#007f83" font-weight="600" text-anchor="start"></text>
<text x="1030" y="454" font-size="25" fill="#007f83" font-weight="700" text-anchor="middle">10:20</text>
<text x="1030" y="492" font-size="19" fill="#007f83" font-weight="600" text-anchor="middle">Servicio recuperado</text>
<line x1="185" y1="290" x2="425" y2="290" stroke="#2463a5" stroke-width="4"/>
<line x1="185" y1="278" x2="185" y2="302" stroke="#2463a5" stroke-width="3"/>
<line x1="425" y1="278" x2="425" y2="302" stroke="#2463a5" stroke-width="3"/>
<text x="305" y="251" font-size="28" fill="#2463a5" font-weight="700" text-anchor="middle">5 min</text>
<text x="305" y="212" font-size="20" fill="#2463a5" font-weight="600" text-anchor="middle">Ventana de datos en riesgo</text>
<line x1="425" y1="330" x2="1030" y2="330" stroke="#007f83" stroke-width="4"/>
<line x1="425" y1="318" x2="425" y2="342" stroke="#007f83" stroke-width="3"/>
<line x1="1030" y1="318" x2="1030" y2="342" stroke="#007f83" stroke-width="3"/>
<text x="750" y="290" font-size="26" fill="#007f83" font-weight="700" text-anchor="middle">15 min de interrupción</text>
<rect x="80" y="550" width="490" height="114" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="100" y="584" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">RPO · objetivo de punto de recuperación</text>
<text x="100" y="616" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">¿Qué pérdida temporal de datos es aceptable?</text>
<text x="100" y="644" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">El ejemplo expone hasta 5 minutos.</text>
<rect x="620" y="550" width="490" height="114" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="640" y="584" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">RTO · objetivo de tiempo de recuperación</text>
<text x="640" y="616" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">¿En cuánto tiempo debemos restaurar servicio?</text>
<text x="640" y="644" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">El ejemplo tarda 15 minutos.</text>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">Un backup existente no prueba recuperación: hay que restaurarlo y comprobar integridad y operación.</text>
</g></svg>