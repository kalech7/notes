<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<title>La arquitectura une contexto y decisiones</title><desc>Cuatro dimensiones relacionadas; el estilo se elige después de entender el problema.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#007f83" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="760" fill="#f6f8f8"/>
<text x="48" y="57" font-size="32" fill="#16324f" font-weight="700" text-anchor="start">La arquitectura une contexto y decisiones</text>
<text x="48" y="92" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Cuatro dimensiones relacionadas; el estilo se elige después de entender el problema.</text>
<line x1="48" y1="117" x2="1152" y2="117" stroke="#ccd8df" stroke-width="1"/>
<rect x="360" y="150" width="480" height="100" rx="18" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
<text x="380" y="184" font-size="23" fill="#16324f" font-weight="700" text-anchor="start">CONTEXTO</text>
<text x="380" y="216" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Negocio · presupuesto · equipo · restricciones</text>
<rect x="70" y="310" width="465" height="135" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="90" y="344" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">CARACTERÍSTICAS</text>
<text x="90" y="376" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Qué capacidades hacen viable el sistema</text>
<text x="90" y="404" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo: soportar el pico del almuerzo</text>
<rect x="665" y="310" width="465" height="135" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="685" y="344" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">COMPONENTES LÓGICOS</text>
<text x="685" y="376" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Qué responsabilidades tiene el sistema</text>
<text x="685" y="404" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo: pedidos, pagos y entregas</text>
<line x1="480" y1="250" x2="300" y2="310" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="250" x2="900" y2="310" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="520" width="465" height="125" rx="18" fill="#ffffff" stroke="#2463a5" stroke-width="2"/>
<text x="90" y="554" font-size="23" fill="#2463a5" font-weight="700" text-anchor="start">ESTILO</text>
<text x="90" y="586" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Organiza las piezas y sus relaciones</text>
<text x="90" y="614" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo: monolito modular</text>
<rect x="665" y="520" width="465" height="125" rx="18" fill="#ffffff" stroke="#007f83" stroke-width="2"/>
<text x="685" y="554" font-size="23" fill="#007f83" font-weight="700" text-anchor="start">DECISIONES</text>
<text x="685" y="586" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Reglas, alternativas y razones</text>
<text x="685" y="614" font-size="19" fill="#16324f" font-weight="400" text-anchor="start">Ejemplo: cada módulo posee sus datos</text>
<line x1="300" y1="445" x2="300" y2="520" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="900" y1="445" x2="900" y2="520" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="535" y1="580" x2="665" y2="580" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="373" x2="550" y2="373" stroke="#007f83" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="48" y1="700" x2="1152" y2="700" stroke="#ccd8df" stroke-width="1"/>
<text x="48" y="732" font-size="17" fill="#16324f" font-weight="400" text-anchor="start">Elaboración propia. Las flechas expresan influencia; el proceso real es iterativo.</text>
</g></svg>