<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">El fanout reduce la altura y las lecturas de página</title><desc id="desc">Compara un árbol estrecho de cuatro niveles con un B-Tree ancho de tres niveles para mostrar que cada página visitada descarta muchos más rangos.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><style>.t{font:700 25px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:16px system-ui,sans-serif;fill:#475569;text-anchor:middle}.n{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5;rx:10}.b{fill:#ccfbf1;stroke:#0f766e;stroke-width:2.5;rx:10}.e{stroke:#64748b;stroke-width:2;fill:none}.path{stroke:#f59e0b;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="white"/><text x="600" y="42" class="t" font-size="29">Fanout: hacer más trabajo dentro de una página para visitar menos páginas</text>
  <text x="280" y="92" class="t">Árbol estrecho</text><text x="900" y="92" class="t">B-Tree ancho</text>
  <g transform="translate(50 125)">
    <rect x="190" y="0" width="80" height="48" class="n"/><rect x="110" y="95" width="80" height="48" class="n"/><rect x="270" y="95" width="80" height="48" class="n"/><rect x="65" y="190" width="70" height="48" class="n"/><rect x="155" y="190" width="70" height="48" class="n"/><rect x="245" y="190" width="70" height="48" class="n"/><rect x="335" y="190" width="70" height="48" class="n"/><rect x="35" y="285" width="55" height="48" class="n"/><rect x="100" y="285" width="55" height="48" class="n"/><rect x="165" y="285" width="55" height="48" class="n"/><rect x="230" y="285" width="55" height="48" class="n"/><rect x="295" y="285" width="55" height="48" class="n"/><rect x="360" y="285" width="55" height="48" class="n"/>
    <path d="M230 48L150 95M230 48L310 95M150 143L100 190M150 143L190 190M310 143L280 190M310 143L370 190" class="e"/><path d="M230 48L310 95L280 190L322 285" class="path"/>
    <text x="230" y="380" class="s">La ruta resaltada carga 4 páginas.</text>
  </g>
  <g transform="translate(645 125)">
    <rect x="90" y="0" width="330" height="62" class="b"/><text x="255" y="32" class="s">7 separadores → 8 rangos</text>
    <rect x="0" y="145" width="155" height="62" class="b"/><rect x="175" y="145" width="155" height="62" class="b"/><rect x="350" y="145" width="155" height="62" class="b"/>
    <rect x="175" y="290" width="155" height="62" class="b"/><text x="252" y="322" class="s">hoja objetivo</text>
    <path d="M255 62L77 145M255 62L252 145M255 62L427 145" class="e"/><path d="M255 62L252 145L252 290" class="path"/>
    <text x="255" y="380" class="s">La ruta resaltada carga 3 páginas.</text>
  </g>
  <text x="600" y="560" class="t">El costo dominante es saltar entre páginas</text><text x="600" y="592" class="s">Más comparaciones dentro de la página suelen ser más baratas que otro acceso a almacenamiento.</text>
</svg>
