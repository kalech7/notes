<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Big-endian y little-endian</title><desc id="desc">Representa el entero hexadecimal 0x12345678 en cuatro offsets para comparar el orden de bytes y muestra que el lector debe conocer la convención.</desc>
  <defs><style>.t{font:700 26px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:17px system-ui,sans-serif;fill:#475569;text-anchor:middle}.b{font:700 27px ui-monospace,monospace;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.cell{stroke:#334155;stroke-width:2.5}</style></defs>
  <rect width="1200" height="560" fill="white"/><text x="600" y="43" class="t" font-size="30">El mismo entero, dos contratos de orden</text><text x="600" y="83" class="s">Valor lógico: 0x12345678 · cuatro bytes</text>
  <text x="275" y="145" class="t">Big-endian</text><text x="925" y="145" class="t">Little-endian</text>
  <g transform="translate(75 185)"><rect width="100" height="95" fill="#dbeafe" class="cell"/><rect x="100" width="100" height="95" fill="#bfdbfe" class="cell"/><rect x="200" width="100" height="95" fill="#93c5fd" class="cell"/><rect x="300" width="100" height="95" fill="#60a5fa" class="cell"/><text x="50" y="48" class="b">12</text><text x="150" y="48" class="b">34</text><text x="250" y="48" class="b">56</text><text x="350" y="48" class="b">78</text><text x="50" y="125" class="s">+0</text><text x="150" y="125" class="s">+1</text><text x="250" y="125" class="s">+2</text><text x="350" y="125" class="s">+3</text></g>
  <g transform="translate(725 185)"><rect width="100" height="95" fill="#fef3c7" class="cell"/><rect x="100" width="100" height="95" fill="#fde68a" class="cell"/><rect x="200" width="100" height="95" fill="#fcd34d" class="cell"/><rect x="300" width="100" height="95" fill="#fbbf24" class="cell"/><text x="50" y="48" class="b">78</text><text x="150" y="48" class="b">56</text><text x="250" y="48" class="b">34</text><text x="350" y="48" class="b">12</text><text x="50" y="125" class="s">+0</text><text x="150" y="125" class="s">+1</text><text x="250" y="125" class="s">+2</text><text x="350" y="125" class="s">+3</text></g>
  <text x="275" y="355" class="s">El byte más significativo aparece primero.</text><text x="925" y="355" class="s">El byte menos significativo aparece primero.</text>
  <rect x="170" y="405" width="860" height="100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="444" class="t">Los bytes no llevan su interpretación incorporada</text><text x="600" y="478" class="s">Escritor y lector deben acordar tamaño, signo y endianness; de lo contrario obtienen otro número.</text>
</svg>
