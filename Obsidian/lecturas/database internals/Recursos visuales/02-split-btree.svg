<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Split de una hoja B-Tree</title>
  <desc id="desc">Antes, una hoja llena recibe 35. Después, se divide, se copia 30 al padre como separador y la nueva clave queda en la hoja derecha.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .node{fill:#f8fafc;stroke:#334155;stroke-width:3;rx:12}
      .cell{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
      .new{fill:#fef3c7;stroke:#d97706;stroke-width:3}
      .prom{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}
      .t{font:700 23px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
      .s{font:16px system-ui,sans-serif;fill:#475569;text-anchor:middle}
      .k{font:700 21px ui-monospace,monospace;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="620" fill="white"/>
  <text x="600" y="42" class="t" font-size="28">Split de hoja: crear espacio sin romper el orden</text>
  <text x="290" y="93" class="t">Antes</text><text x="895" y="93" class="t">Después</text>
  <rect x="170" y="135" width="240" height="72" class="node"/>
  <line x1="290" y1="135" x2="290" y2="207" stroke="#334155" stroke-width="3"/>
  <text x="230" y="172" class="k">60</text><text x="350" y="172" class="s">otro rango</text>
  <path class="arrow" d="M230 207 L230 280"/>
  <rect x="75" y="285" width="430" height="95" class="node"/>
  <rect x="90" y="300" width="75" height="65" class="cell"/><rect x="170" y="300" width="75" height="65" class="cell"/><rect x="250" y="300" width="75" height="65" class="cell"/><rect x="330" y="300" width="75" height="65" class="cell"/><rect x="410" y="300" width="75" height="65" class="new"/>
  <text x="128" y="333" class="k">10</text><text x="208" y="333" class="k">20</text><text x="288" y="333" class="k">30</text><text x="368" y="333" class="k">40</text><text x="448" y="333" class="k">35</text>
  <text x="290" y="413" class="s">Insertar 35 desborda la capacidad; primero se ordena lógicamente.</text>
  <path class="arrow" d="M530 332 H640"/>
  <text x="585" y="306" class="s">dividir</text>
  <rect x="770" y="135" width="250" height="72" class="node"/>
  <rect x="785" y="148" width="105" height="46" class="prom"/><line x1="900" y1="135" x2="900" y2="207" stroke="#334155" stroke-width="3"/>
  <text x="838" y="171" class="k">30</text><text x="960" y="172" class="s">60…</text>
  <path class="arrow" d="M820 207 L760 280"/><path class="arrow" d="M875 207 L970 280"/>
  <rect x="660" y="285" width="230" height="95" class="node"/><rect x="675" y="300" width="90" height="65" class="cell"/><rect x="770" y="300" width="90" height="65" class="cell"/>
  <text x="720" y="333" class="k">10</text><text x="815" y="333" class="k">20</text>
  <rect x="920" y="285" width="260" height="95" class="node"/><rect x="935" y="300" width="70" height="65" class="cell"/><rect x="1010" y="300" width="70" height="65" class="new"/><rect x="1085" y="300" width="75" height="65" class="cell"/>
  <text x="970" y="333" class="k">30</text><text x="1045" y="333" class="k">35</text><text x="1123" y="333" class="k">40</text>
  <text x="915" y="418" class="s">30 se copia al padre: separa claves &lt; 30 de claves ≥ 30.</text>
  <rect x="165" y="475" width="870" height="95" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="510" class="t">Invariantes conservados</text>
  <text x="600" y="542" class="s">hojas ordenadas · misma profundidad · el padre cubre ambos rangos · la nueva clave está en la hoja correcta</text>
</svg>
